name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck, unit tests, build, verify dist
        run: npm run check
      - name: Package for the Web Store
        run: npm run zip
      - uses: actions/upload-artifact@v4
        with:
          name: anki-quick-add-zip
          path: anki-quick-add-*.zip
