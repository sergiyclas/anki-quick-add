<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5f8dff"/>
      <stop offset="1" stop-color="#2f4fc9"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6ecfb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0b1e5c" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- subtle highlight -->
  <path d="M0 40 Q64 10 128 40 V0 H0 Z" fill="#ffffff" opacity="0.08"/>

  <!-- back card -->
  <rect x="30" y="24" width="76" height="54" rx="10" fill="#ffffff" opacity="0.32" transform="rotate(-9 68 51)"/>

  <!-- front card -->
  <rect x="22" y="40" width="80" height="58" rx="11" fill="url(#card)" filter="url(#shadow)"/>
  <rect x="34" y="54" width="42" height="8" rx="4" fill="#2f4fc9"/>
  <rect x="34" y="69" width="30" height="8" rx="4" fill="#9fb3ea"/>
  <rect x="34" y="84" width="20" height="6" rx="3" fill="#c9d4f3"/>

  <!-- plus badge -->
  <circle cx="98" cy="94" r="21" fill="#ff7a59" filter="url(#shadow)"/>
  <circle cx="98" cy="94" r="21" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="94" y="81" width="8" height="26" rx="4" fill="#ffffff"/>
  <rect x="85" y="90" width="26" height="8" rx="4" fill="#ffffff"/>
</svg>
